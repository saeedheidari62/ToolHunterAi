<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ToolHunterAI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #f3f3f3;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .12);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            direction: ltr;
            text-align: left;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #000;
        }

        .info {
            margin-top: 25px;
            padding: 15px;
            background: #f7f7f7;
            border-radius: 10px;
            line-height: 1.9;
            color: #555;
        }

        .menu {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .menu a {
            flex: 1;
            text-align: center;
            text-decoration: none;
            background: #444;
            color: white;
            padding: 12px;
            border-radius: 8px;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                margin: 15px auto;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔧 ToolHunterAI</h1>

    <div class="subtitle">
        دستیار هوشمند خرید ابزار دست‌دوم
    </div>

    <form action="/analyze" method="post">

        <label for="url">
            لینک آگهی دیوار
        </label>

        <input
            id="url"
            type="url"
            name="url"
            placeholder="https://divar.ir/v/..."
            required
        >

        <button type="submit">
            🔍 تحلیل آگهی
        </button>

    </form>

    <div class="info">
        لینک آگهی را وارد کنید تا ToolHunterAI اطلاعات آگهی،
        قیمت، فروشنده، توضیحات و تصاویر را بررسی کرده و
        نتیجه نهایی <strong>BUY / REVIEW / DON'T BUY</strong>
        را ارائه کند.
    </div>

    <div class="menu">

        <a href="/history">
            تاریخچه
        </a>

        <a href="/dashboard">
            داشبورد
        </a>

    </div>

</div>

</body>
</html>
