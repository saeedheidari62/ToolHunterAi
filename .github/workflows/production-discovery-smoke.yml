name: ToolHunterAI Production Discovery Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test production discovery endpoint
        env:
          PRODUCTION_URL: https://toolhunterai.onrender.com
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl -sS -o "$response_file" -w '%{http_code}' \
            -X POST "$PRODUCTION_URL/discover" \
            -H 'Content-Type: application/json' \
            --data '{"city":"tehran","query":"Bosch GBH 2-26","limit":5}' \
            --max-time 90)"

          echo "HTTP status: $status"
          cat "$response_file"

          test "$status" = "200"
          python - "$response_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as fh:
              payload = json.load(fh)

          if not isinstance(payload, dict):
              raise SystemExit("response is not a JSON object")

          required = ("results", "ranking", "best_choice")
          missing = [key for key in required if key not in payload]
          if missing:
              raise SystemExit(f"missing response keys: {missing}")

          results = payload["results"]
          ranking = payload["ranking"]
          best_choice = payload["best_choice"]

          if not isinstance(results, list) or not results:
              raise SystemExit("results must be a non-empty list")
          if not isinstance(ranking, list) or not ranking:
              raise SystemExit("ranking must be a non-empty list")
          if not isinstance(best_choice, dict) or not best_choice:
              raise SystemExit("best_choice must be a non-empty object")

          selected = payload.get("selected")
          analyzed = payload.get("analyzed")
          if not isinstance(selected, int) or selected <= 0:
              raise SystemExit(f"invalid selected count: {selected!r}")
          if not isinstance(analyzed, int) or analyzed <= 0:
              raise SystemExit(f"invalid analyzed count: {analyzed!r}")
          if analyzed != selected:
              raise SystemExit(
                  f"analysis coverage mismatch: selected={selected}, analyzed={analyzed}"
              )

          print("Production discovery analysis gate: PASS")
          print(f"selected={selected} analyzed={analyzed} ranking={len(ranking)}")
          PY
